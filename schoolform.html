<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>school application form</title>
</head>
<body>
   <div style="background-color: rgb(236, 217, 191);color: black;">
    <h1>School Application Form</h1>
    <p>Please fill out the school application form below. 
        All fields marked with an asterisk (*) are required.
    </p>
    <form action="submit_form.php" method="post">    
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required placeholder="enter your full name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="enter your email"><br><br>

        <label for="phone">Phone Number:</label>
        <input type="number" id="phone" name="phone" placeholder="enter your phone number"><br><br>

        <label for="address">Address:</label>
        <textarea id="address" name="address" placeholder="enter your address"></textarea><br><br>

        <label for="subject">Grade Applying For:</label>
        <select id="subject" name="grade">
            <option value="">Select grade</option>
            <option value="1">mathematics</option>
            <option value="2">English language</option>
            <option value="3">physics</option>
            <option value="4">chemistry</option>
            <option value="5">biology</option>
            <option value="6">Grade 5</option>
            <option value="7">Economics</option>
            <!-- Add more grades as needed -->
        </select><br><br> 
        <input type="submit" value="Submit Application">     
</body>
<p>Note: That this child must be older than the required age </p>
